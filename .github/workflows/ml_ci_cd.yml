name: Modelops deploy

on:
  push:
    branches: [ main, master ]
  repository_dispatch:
    types: [ ml_ci_cd ]

jobs:
  ml_ci_cd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: python version
        run: python --version

      - name: pip install
        run: pip install -r requirements.txt

      - name: download dataset
        if: ${{ github.event.client_payload.dataseturl != null && github.event.client_payload.dataseturl != '' }}
        run: |
          mkdir -p data
          wget -O data/Perfumes_dataset.csv "${{ github.event.client_payload.dataseturl }}"

      - name: train model
        run: python model/train.py

      - name: docker login
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USER" --password-stdin

      - name: docker build and push
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
          INPUT_SHA: ${{ github.event.client_payload.sha }}
        run: |
          TAG="${INPUT_SHA:-latest}"
          echo "Publicando con Tag: $TAG"
          IMAGE="${DOCKER_USER}/${MODEL_NAME}:${TAG}"
          LATEST="${DOCKER_USER}/${MODEL_NAME}:latest"
          docker build -t "$IMAGE" -t "$LATEST" .
          docker push "$IMAGE"
          docker push "$LATEST"
