name: Modelops deploy

on:
  push:
    branches: [ main, master ]
  repository_dispatch:
    types: [ ml_ci_cd ]

jobs:
  ml_ci_cd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: python version
        run: python --version

      - name: pip install
        run: pip install -r requirements.txt

      - name: download dataset
        if: ${{ github.event.client_payload.dataseturl != null && github.event.client_payload.dataseturl != '' }}
        run: wget -O data/Perfumes_dataset.csv "${{ github.event.client_payload.dataseturl }}"

      - name: train model
        run: python model/train.py

      - name: docker login
        if: ${{ secrets.DOCKER_USER != '' && secrets.DOCKER_PASSWORD != '' }}
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: docker login -u "$DOCKER_USER" -p "$DOCKER_PASSWORD"

      - name: docker build and push
        if: ${{ secrets.DOCKER_USER != '' && secrets.DOCKER_PASSWORD != '' }}
        run: |
          TAG="${{ github.event.client_payload.sha || 'latest' }}"
          IMAGE="${{ secrets.DOCKER_USER }}/${{ secrets.MODEL_NAME }}:${TAG}"
          LATEST="${{ secrets.DOCKER_USER }}/${{ secrets.MODEL_NAME }}:latest"
          docker build -t "$IMAGE" -t "$LATEST" .
          docker push "$IMAGE"
          docker push "$LATEST"
